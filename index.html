<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container dashboard-view">
        <header class="hero">
            <div class="hero-text">
                <p class="eyebrow">Weekly lineup</p>
                <h1>Tranquillo Meal Planner</h1>
            </div>
            <!-- <div class="pill-stack">
                <span class="pill">Mobile-first</span>
                <span class="pill">Quick search</span>
                <span class="pill">Sheet syncing</span>
            </div> -->
            <div class="nav-actions">
                <a class="link-button" href="planner.html">Open Planner</a>
                <a class="link-button secondary" href="add-meal.html">Add Meal</a>
                <a class="link-button secondary" href="groceries.html">Groceries</a>
            </div>
        </header>
        <div id="message" class="toast" role="status" aria-live="polite"></div>
        <div id="week-cards" class="cards"></div>
        <div class="meal-selection">
            <input type="text" id="meal-search" placeholder="Search meal...">
            <div id="meal-suggestions" class="suggestions"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
